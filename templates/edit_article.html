{% extends "base.html" %}
{% block title %}Edit Article – BlogVerse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
          <h2 class="fw-bold mb-1"><i class="bi bi-pencil me-2 text-primary"></i>Edit Article</h2>
          <p class="text-muted mb-4">Update your article below</p>

          <form id="editForm" method="POST" action="{{ url_for('edit_article', article_id=article.id) }}" novalidate>

            <div class="mb-4">
              <label class="form-label fw-semibold">Article Title</label>
              <input type="text" name="title" id="artTitle" class="form-control form-control-lg"
                     value="{{ article.title }}">
              <div class="invalid-feedback">Please enter a title.</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" id="artCategory" class="form-select form-select-lg">
                {% for cat in ['Technology','Science','Health','Travel','Food','Business','Education','Lifestyle','Entertainment','Other'] %}
                  <option value="{{ cat }}" {% if article.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Content</label>
              <textarea name="content" id="artContent" class="form-control" rows="12">{{ article.content }}</textarea>
              <div class="invalid-feedback">Content cannot be empty.</div>
              <small class="text-muted" id="wordCount"></small>
            </div>

            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-primary btn-lg px-5 fw-semibold">
                <i class="bi bi-save me-2"></i>Save Changes
              </button>
              <a href="{{ url_for('view_article', article_id=article.id) }}" class="btn btn-outline-secondary btn-lg px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function countWords() {
  const words = $('#artContent').val().trim().split(/\s+/).filter(w => w.length > 0);
  $('#wordCount').text(words.length + ' word' + (words.length !== 1 ? 's' : ''));
}
countWords();
$('#artContent').on('input', countWords);
</script>
{% endblock %}
