{% extends "base.html" %}
{% block title %}Login – BlogVerse{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-80">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg auth-card">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="bi bi-box-arrow-in-right display-5 text-primary"></i>
              <h2 class="fw-bold mt-2">Welcome Back</h2>
              <p class="text-muted">Sign in to your BlogVerse account</p>
            </div>

            <form id="loginForm" method="POST" action="{{ url_for('login') }}" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" id="loginEmail" class="form-control form-control-lg" placeholder="you@example.com">
                <div class="invalid-feedback">Please enter your email.</div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" id="loginPassword" class="form-control form-control-lg" placeholder="Your password">
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Sign In</button>
              </div>
            </form>

            <p class="text-center mt-4 mb-0 text-muted">
              Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Join Free</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
