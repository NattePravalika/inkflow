{% extends "base.html" %}
{% block title %}Published! – BlogVerse{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-80">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <div class="success-icon mb-4">
          <i class="bi bi-check-circle-fill display-1 text-success"></i>
        </div>
        <h1 class="fw-bold mb-3">Article Published!</h1>
        <p class="text-muted mb-4">
          Your article has been successfully published and is now live for readers around the world.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
          <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-2"></i>Go to Home
          </a>
          <a href="{{ url_for('new_article') }}" class="btn btn-outline-primary px-4">
            <i class="bi bi-pencil-square me-2"></i>Write Another
          </a>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-grid me-2"></i>Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
